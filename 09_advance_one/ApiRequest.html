<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style = "background-color: #212121;">
    <!-- Value	State	Description
0	UNSENT	Client has been created. open() not called yet.
1	OPENED	open() has been called.
2	HEADERS_RECEIVED	send() has been called, and headers and status are available.
3	LOADING	Downloading; responseText holds partial data.
4	DONE	The operation is complete. -->

<table style="border-collapse: collapse; width: 100%; color: #345069;">
    <thead>
        <tr>
            <th style="border: 1px solid #345069; padding: 8px;">Value</th>
            <th style="border: 1px solid #345069; padding: 8px;">State</th>
            <th style="border: 1px solid #345069; padding: 8px;">Description</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td style="border: 1px solid #345069; padding: 8px;">0</td>
            <td style="border: 1px solid #345069; padding: 8px;">UNSENT</td>
            <td style="border: 1px solid #345069; padding: 8px;">Client has been created. open() not called yet.</td>
        </tr>
        <tr>
            <td style="border: 1px solid #345069; padding: 8px;">1</td>
            <td style="border: 1px solid #345069; padding: 8px;">OPENED</td>
            <td style="border: 1px solid #345069; padding: 8px;">open() has been called.</td>
        </tr>
        <tr>
            <td style="border: 1px solid #345069; padding: 8px;">2</td>
            <td style="border: 1px solid #345069; padding: 8px;">HEADERS_RECEIVED</td>
            <td style="border: 1px solid #345069; padding: 8px;">send() has been called, and headers and status are available.</td>
        </tr>
        <tr>
            <td style="border: 1px solid #345069; padding: 8px;">3</td>
            <td style="border: 1px solid #345069; padding: 8px;">LOADING</td>
            <td style="border: 1px solid #345069; padding: 8px;">Downloading; responseText holds partial data.</td>
        </tr>
        <tr>
            <td style="border: 1px solid #345069; padding: 8px;">4</td>
            <td style="border: 1px solid #345069; padding: 8px;">DONE</td>
            <td style="border: 1px solid #345069; padding: 8px;">The operation is complete.</td>
        </tr>
    </tbody>
</table>

</body>
<script>
    const requestURL = 'https://api.github.com/users/ajaysharma2390'
    const xhr = new XMLHttpRequest();
    xhr.open('GET', requestURL)
    xhr.onreadystatechange = function() {        
        console.log(xhr.readyState);
        if (xhr.readyState === 4) {
            document.body.style.display = "flex"
            document.body.style.flexDirection = "column"
            document.body.style.alignItems = "center"
            const card = document.createElement('div');
            card.style.backgroundColor = "#0D1117"
            card.style.display = "flex"
            card.style.flexDirection = "column"
            card.style.alignItems = "center"
            card.style.width = "300px"
            card.style.padding = "20px"
            card.style.borderRadius = "10px"
            document.body.appendChild(card)
            
            
            const data = JSON.parse(this.responseText)
            console.log(typeof data);            
            console.log(data);            
            console.log(data.followers);
            
            const image = document.createElement('img');
            image.src = data.avatar_url;
            image.style.width = "150px"
            image.style.borderRadius = "50%"
            card.appendChild(image);

            const follower = document.createElement('div');
            follower.innerHTML = `<h3>Followers - ${data.followers}</h3>`;
            follower.style.color = "aliceblue"
            card.appendChild(follower);

            const button = document.createElement('button')
            button.innerText = `Press to get DATA`
            button.style.color = "darkgreen"
            const action = function(){
                button.disabled = true;
                const userData = document.createElement('div')
                userData.style.backgroundColor = "#2D3034"
                userData.style.borderRadius = "2%"
                document.body.appendChild(userData)

                const gitData = document.createElement('pre');
                gitData.innerText = JSON.stringify(data, null, 2);
                gitData.style.color = "orange"
                userData.appendChild(gitData);
            }
            button.addEventListener('click', action)
            card.appendChild(button)
            
        }
    }        
    xhr.send()
</script>
</html>
